name: Build & CI

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main, master, develop]

env:
  QT_VERSION: '5.15.2'
  CMAKE_VERSION: '3.25.0'

jobs:
  build:
    name: ${{ matrix.platform }} · ${{ github.event_name == 'pull_request' && 'PR' || 'Push' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            build_type: Release
            qt_arch: win64_msvc2019_64
            cmake_generator: 'Visual Studio 17 2022'
            cmake_arch: x64
            artifact_name: windows-release

          - os: ubuntu-22.04
            platform: linux
            build_type: Release
            qt_arch: gcc_64
            cmake_generator: 'Unix Makefiles'
            artifact_name: linux-release

          - os: macos-latest
            platform: macos
            build_type: Release
            qt_arch: clang_64
            cmake_generator: 'Unix Makefiles'
            artifact_name: macos-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ============ Platform Setup ============

      - name: Setup MSVC (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.cmake_arch }}

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.platform == 'macos' && 'mac' || matrix.platform }}
          target: 'desktop'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtnetwork qtwidgets qtxml qttest qtnetworkauth'
          cache: true

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libgl1-mesa-dev \
            xvfb

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'macos'
        run: brew install openssl@3

      # ============ Configure & Build ============

      - name: Configure CMake (Windows)
        if: matrix.platform == 'windows'
        run: |
          cmake -S . -B build `
            -G "${{ matrix.cmake_generator }}" `
            -A ${{ matrix.cmake_arch }} `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_PREFIX_PATH="$env:Qt5_DIR" `
            -DBUILD_TESTS=ON

      - name: Configure CMake (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake -S . -B build \
            -G "${{ matrix.cmake_generator }}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="${Qt5_DIR}" \
            -DBUILD_TESTS=ON

      - name: Configure CMake (macOS)
        if: matrix.platform == 'macos'
        run: |
          export OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)
          cmake -S . -B build \
            -G "${{ matrix.cmake_generator }}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DCMAKE_PREFIX_PATH="${Qt5_DIR}" \
            -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT_DIR}" \
            -DBUILD_TESTS=ON

      - name: Build project
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # ============ Test ============

      - name: Run tests (Windows)
        if: matrix.platform == 'windows'
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 120

      - name: Run tests (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 120

      - name: Run tests (macOS)
        if: matrix.platform == 'macos'
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 120

      # ============ Artifacts (push only, skip PR) ============

      - name: Prepare artifacts (Windows)
        if: matrix.platform == 'windows' && github.event_name != 'pull_request'
        shell: cmd
        run: |
          mkdir artifacts\library artifacts\requester artifacts\downloader artifacts\tests
          copy "build\${{ matrix.build_type }}\QNetworkRequest.dll" artifacts\library\
          copy "build\${{ matrix.build_type }}\QNetworkRequest.pdb" artifacts\library\
          copy "build\${{ matrix.build_type }}\QtRequester.exe" artifacts\requester\
          copy "build\${{ matrix.build_type }}\QtDownloader.exe" artifacts\downloader\
          copy "build\${{ matrix.build_type }}\UnitTests.exe" artifacts\tests\
          copy "ThirdParty\openssl\1.1.1\bin\libcrypto-1_1-x64.dll" artifacts\library\
          copy "ThirdParty\openssl\1.1.1\bin\libssl-1_1-x64.dll" artifacts\library\

      - name: Prepare artifacts (Linux)
        if: matrix.platform == 'linux' && github.event_name != 'pull_request'
        run: |
          mkdir -p artifacts/library artifacts/requester artifacts/downloader artifacts/tests
          cp "build/${{ matrix.build_type }}/libQNetworkRequest.so" artifacts/library/ 2>/dev/null || true
          cp "build/${{ matrix.build_type }}/QtRequester" artifacts/requester/ 2>/dev/null || true
          cp "build/${{ matrix.build_type }}/QtDownloader" artifacts/downloader/ 2>/dev/null || true
          cp "build/${{ matrix.build_type }}/UnitTests" artifacts/tests/ 2>/dev/null || true

      - name: Prepare artifacts (macOS)
        if: matrix.platform == 'macos' && github.event_name != 'pull_request'
        run: |
          mkdir -p artifacts/library artifacts/requester artifacts/downloader artifacts/tests
          cp "build/${{ matrix.build_type }}/libQNetworkRequest.dylib" artifacts/library/ 2>/dev/null || true
          cp -R "build/${{ matrix.build_type }}/QtRequester.app" artifacts/requester/ 2>/dev/null || true
          cp -R "build/${{ matrix.build_type }}/QtDownloader.app" artifacts/downloader/ 2>/dev/null || true
          cp "build/${{ matrix.build_type }}/UnitTests" artifacts/tests/ 2>/dev/null || true

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/
          retention-days: 7

      - name: Upload build logs on failure
        if: failure() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-logs
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          retention-days: 7
