name: Multi-Platform Build

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main, master, develop]

env:
  QT_VERSION: '5.15.2'
  CMAKE_VERSION: '3.25.0'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows configuration
          - os: windows-2022
            platform: windows
            build_type: Release
            qt_arch: win64_msvc2019_64
            cmake_generator: 'Visual Studio 17 2022'
            cmake_arch: x64
            artifact_name: windows-msvc2022-release

          # Linux configuration
          - os: ubuntu-22.04
            platform: linux
            build_type: Release
            qt_arch: gcc_64
            cmake_generator: 'Unix Makefiles'
            artifact_name: linux-gcc-release

          # macOS configuration
          - os: macos-12
            platform: macos
            build_type: Release
            qt_arch: clang_64
            cmake_generator: 'Unix Makefiles'
            artifact_name: macos-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ============ Platform-Specific Setup ============

      # Windows setup
      - name: Setup Windows environment
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.cmake_arch }}

      - name: Setup Qt (Windows)
        if: matrix.platform == 'windows'
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtnetworkauth'
          cache: true

      - name: Install CMake (Windows)
        if: matrix.platform == 'windows'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      # Linux setup
      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libgl1-mesa-dev \
            libglib2.0-0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            xvfb \
            dbus-x11

      - name: Setup Qt (Linux)
        if: matrix.platform == 'linux'
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtnetworkauth'
          cache: true

      - name: Install CMake (Linux)
        if: matrix.platform == 'linux'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      # macOS setup
      - name: Install system dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install openssl@1.1

      - name: Setup Qt (macOS)
        if: matrix.platform == 'macos'
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtnetworkauth'
          cache: true

      - name: Install CMake (macOS)
        if: matrix.platform == 'macos'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}

      # ============ Caching Strategy ============

      - name: Cache CMake build
        uses: actions/cache@v3
        with:
          path: |
            build
            ${{ github.workspace }}/build/**/CMakeCache.txt
            ${{ github.workspace }}/build/**/CMakeFiles
          key: ${{ matrix.artifact_name }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ matrix.artifact_name }}-cmake-

      # ============ Configuration & Build ============

      - name: Configure CMake (Windows)
        if: matrix.platform == 'windows'
        run: |
          cmake -S . -B build `
            -G "${{ matrix.cmake_generator }}" `
            -A ${{ matrix.cmake_arch }} `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_PREFIX_PATH="$env:Qt5_DIR" `
            -DBUILD_TESTS=ON

      - name: Configure CMake (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake -S . -B build \
            -G "${{ matrix.cmake_generator }}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="${Qt5_DIR}" \
            -DBUILD_TESTS=ON

      - name: Configure CMake (macOS)
        if: matrix.platform == 'macos'
        run: |
          export OPENSSL_ROOT_DIR=$(brew --prefix openssl@1.1)
          cmake -S . -B build \
            -G "${{ matrix.cmake_generator }}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="${Qt5_DIR}" \
            -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT_DIR}" \
            -DBUILD_TESTS=ON

      - name: Build project
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # ============ Testing ============

      - name: Run unit tests (Windows)
        if: matrix.platform == 'windows'
        run: |
          cd build\test\${{ matrix.build_type }}
          .\UnitTests.exe --output-on-failure

      - name: Run unit tests (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd build/test
          xvfb-run --auto-servernum ctest --output-on-failure -C ${{ matrix.build_type }}

      - name: Run unit tests (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd build/test
          ctest --output-on-failure -C ${{ matrix.build_type }}

      # ============ Artifact Collection ============

      - name: Prepare artifacts (Windows)
        if: matrix.platform == 'windows'
        run: |
          mkdir -p artifacts
          copy build\${{ matrix.build_type }}\*.dll artifacts\
          copy build\${{ matrix.build_type }}\*.exe artifacts\
          copy ThirdParty\openssl\1.1.1\bin\*.dll artifacts\

      - name: Prepare artifacts (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p artifacts
          find build/${{ matrix.build_type }} -type f \( -executable -perm +111 -o -name "*.so*" \) -exec cp {} artifacts/ \;

      - name: Prepare artifacts (macOS)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p artifacts
          find build/${{ matrix.build_type }} -type f \( -perm +111 -o -name "*.dylib*" \) -exec cp {} artifacts/ \;

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.artifact_name }}-logs
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          retention-days: 7
