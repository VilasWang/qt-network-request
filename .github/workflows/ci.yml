name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-13]
        build_type: [Release]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          modules: qtnetwork qtwidgets qtxml qttest
          cache: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev libgl1-mesa-dev libxkbcommon-x11-0 libxcb-xinerama0

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1

      - name: Set OpenSSL root (macOS)
        if: runner.os == 'macOS'
        run: echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl)" >> $GITHUB_ENV

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build library and apps
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Build and run tests (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --build build --config ${{ matrix.build_type }} --target UnitTests UiTests --parallel
          xvfb-run --auto-servernum ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 120

      - name: Build and run tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --build build --config ${{ matrix.build_type }} --target UnitTests UiTests --parallel
          ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 120

      - name: Build and run tests (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --build build --config ${{ matrix.build_type }} --target UnitTests UiTests --parallel
          ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 120
